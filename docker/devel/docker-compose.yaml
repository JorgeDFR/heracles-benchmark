---
services:

  # Graph database storing the 3d scene graph
  neo4j:
    image: neo4j:5.25.1
    environment:
      NEO4J_server_bolt_listen__address: :7683
      NEO4J_server_http_advertised__address: :7469
      NEO4J_server_http_listen__address: :7469
      NEO4J_AUTH: neo4j/neo4j_pw
    healthcheck:
      test: [CMD-SHELL, wget --no-verbose --tries=1 --spider http://localhost:7469 || exit 1]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 2s
    networks: [heracles_net]
    ports: [7683:7683, 7469:7469]

  # Ollama server
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    restart: unless-stopped
    gpus: all
    volumes: [ollama-cache:/root/.ollama]
    healthcheck:
      test: [CMD-SHELL, bash, -c, "{ printf >&3 'GET / HTTP/1.0\\r\\n\\r\\n'; cat <&3; } 3<>/dev/tcp/localhost/11434 | grep 'Ollama is' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [heracles_net]
    ports: [11434:11434]

  # Hugging Face server
  huggingface:
    build:
      context: ../..
      dockerfile: docker/devel/Dockerfile.huggingface_server
    container_name: huggingface
    restart: unless-stopped
    gpus: all
    environment:
      HF_BASE_MODEL: google/gemma-4-E2B-it
      HF_ADAPTER_PATH: /models/gemma-4-E2B-it-3dsg-text2cypher-lora
      HF_SERVED_MODEL_NAME: gemma-4-E2B-it-3dsg-text2cypher-lora
      HF_TRUST_REMOTE_CODE: "true"
      HF_LOAD_IN_4BIT: "true"
      HF_DTYPE: bfloat16
    volumes: [
      $HOME/devel/agentic_code/workspace/3dsg-text2cypher/outputs/gemma-4-E2B-it-3dsg-text2cypher-lora:/models/gemma-4-E2B-it-3dsg-text2cypher-lora:ro,
      huggingface-cache:/root/.cache/huggingface
    ]
    healthcheck:
      test: [CMD-SHELL, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m
    networks: [heracles_net]
    ports: [8000:8000]

  # Standalone python interpreter example for running queries against database
  cli:
    build:
      context: ../..
      dockerfile: docker/main/Dockerfile.cli
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      HERACLES_NEO4J_USERNAME: neo4j
      HERACLES_NEO4J_PASSWORD: neo4j_pw
      HERACLES_NEO4J_URI: neo4j://neo4j:7683
    networks: [heracles_net]
    stdin_open: true
    tty: true
    entrypoint: [ipython, -i, /heracles/examples/load_scene_graph.py, --, --scene_graph, /data/scene_graphs/example_dsg.json]

  # Developing container for test heracles_agents example scripts
  heracles_dev:
    build:
      context: ../..
      dockerfile: docker/devel/Dockerfile.heracles_dev
    depends_on:
      neo4j:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
      # huggingface:
      #   condition: service_healthy
    environment:
      HERACLES_NEO4J_USERNAME: neo4j
      HERACLES_NEO4J_PASSWORD: neo4j_pw
      HERACLES_NEO4J_URI: neo4j://neo4j:7683
      # HERACLES_OPENAI_API_KEY: $OPENAI_API_KEY
      # HERACLES_ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
      HERACLES_OPENROUTER_API_KEY: $OPENROUTER_API_KEY
      # OLLAMA_HOST: http://ollama:11434
      # HUGGINGFACE_HOST: http://huggingface:8000
      HERACLES_AGENTS_PATH: /heracles_agents
      ADT4_HERACLES_IP: neo4j
      ADT4_HERACLES_PORT: 7683
    volumes: [../../external/heracles_agents:/heracles_agents]
    networks: [heracles_net]
    extra_hosts: [host.docker.internal:host-gateway]
    stdin_open: true
    tty: true
    entrypoint: [/bin/bash]

  # Developing container for test heracles_agents chat interface with ROS
  # heracles_ros_dev:
  #   build:
  #     context: ../..
  #     dockerfile: docker/devel/Dockerfile.heracles_ros_dev
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   environment:
  #     HERACLES_NEO4J_USERNAME: neo4j
  #     HERACLES_NEO4J_PASSWORD: neo4j_pw
  #     HERACLES_NEO4J_URI: neo4j://neo4j:7683
  #     HERACLES_OPENROUTER_API_KEY: $OPENROUTER_API_KEY
  #     HERACLES_AGENTS_PATH: /root/ros2_ws/src/heracles_agents
  #     ADT4_HERACLES_IP: neo4j
  #     ADT4_HERACLES_PORT: 7683
  #     HERACLES_IP: neo4j
  #     HERACLES_PORT: 7683
  #     HERACLES_VENV: ''
  #     DISPLAY: $DISPLAY
  #     QT_X11_NO_MITSHM: 1
  #   volumes: [
  #     ../../external/heracles_agents:/root/ros2_ws/src/heracles_agents,
  #     /tmp/.X11-unix:/tmp/.X11-unix:rw
  #   ]
  #   devices: [/dev/dri]
  #   networks: [heracles_net]
  #   extra_hosts: [host.docker.internal:host-gateway]
  #   stdin_open: true
  #   tty: true
  #   entrypoint: [/bin/bash]

networks:
  heracles_net:
    name: heracles_net
    driver: bridge

volumes:
  ollama-cache:
    name: ollama-cache
  huggingface-cache:
    name: huggingface-cache
