qa:
- id: qa_class_count_in_room_class
  description: Calibration anchor for class grounding and containment.
  question_template: How many {target_object_class_plural} are in the {source_room_class_plural}?
  overlap_class: direct
  tags:
  - hierarchy
  - count
  - class
  parameters:
    target_object_class_plural: object_class_plural
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_class_near_class
  description: Calibration anchor for existential metric class relations.
  question_template: Which {target_object_class_plural} are at most {radius_m} meters from at least one {reference_object_class_singular}?
  overlap_class: direct
  tags:
  - spatial
  - radius
  - existential
  parameters:
    target_object_class_plural: object_class_plural
    radius_m: distance_m
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_closest_class_pairs_in_room_class
  description: Closest cross-class pairs after a shared-room restriction.
  question_template: Among pairs consisting of one {target_object_class_singular} and one {reference_object_class_singular} in the same {source_room_class_singular}, which are closest together? Include all ties.
  overlap_class: related
  tags:
  - spatial
  - pairs
  - hierarchy
  - ties
  parameters:
    target_object_class_singular: object_class_singular
    reference_object_class_singular: object_class_singular
    source_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_counts_per_room
  description: Grouped counting with zero rows retained.
  question_template: How many {target_object_class_plural} are in each {source_room_class_singular}? Include zero counts.
  overlap_class: related
  tags:
  - hierarchy
  - grouped_count
  - zero
  parameters:
    target_object_class_plural: object_class_plural
    source_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_rooms_with_both_classes
  description: Intersect two containment conditions.
  question_template: Which {source_room_class_plural} contain at least one {target_object_class_singular} and at least one {reference_object_class_singular}?
  overlap_class: related
  tags:
  - hierarchy
  - intersection
  - existential
  parameters:
    source_room_class_plural: room_class_plural
    target_object_class_singular: object_class_singular
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_rooms_with_target_without_excluded
  description: Negate existence of a class rather than filter individual objects.
  question_template: Which rooms contain at least one {target_object_class_singular} but no {excluded_object_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - anti_join
  - negation
  parameters:
    target_object_class_singular: object_class_singular
    excluded_object_class_plural: object_class_plural
  requires:
  - object_classes
  - containment
- id: qa_rooms_with_exact_count
  description: Filter groups by exact distinct count.
  question_template: Which {source_room_class_plural} contain exactly {required_count} {target_object_class_counted}?
  overlap_class: related
  tags:
  - hierarchy
  - grouped_count
  - exact_cardinality
  parameters:
    source_room_class_plural: room_class_plural
    required_count: positive_integer
    target_object_class_counted: object_class_counted
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_classes_in_every_room
  description: Relational division across a class-selected room set.
  question_template: Which kinds of objects can be found in every {source_room_class_singular}?
  overlap_class: absent
  tags:
  - hierarchy
  - universal
  - relational_division
  parameters:
    source_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_objects_sharing_place
  description: Resolve same-place membership without giving a place ID.
  question_template: Which {target_object_class_plural} share a mapped location with at least one {reference_object_class_singular} inside any {source_room_class_singular}?
  overlap_class: related
  tags:
  - hierarchy
  - shared_parent
  - class
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
    source_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
  - navigable_places
- id: qa_rooms_with_most_targets
  description: Argmax over class-filtered room counts.
  question_template: Which {source_room_class_plural} have the most {target_object_class_plural}? Include all ties.
  overlap_class: related
  tags:
  - hierarchy
  - aggregation
  - extrema
  parameters:
    source_room_class_plural: room_class_plural
    target_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_rooms_with_highest_target_fraction
  description: Optimize a normalized statistic rather than a raw count.
  question_template: In which nonempty {source_room_class_plural} do {target_object_class_plural} make up the largest
    proportion of the contents? Include all ties.
  overlap_class: absent
  tags:
  - hierarchy
  - ratio
  - extrema
  parameters:
    source_room_class_plural: room_class_plural
    target_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_classes_shared_between_room_classes
  description: Intersect inventories over two semantic region groups.
  question_template: Which kinds of objects occur in both the {source_room_class_plural} and the {comparison_room_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - class_inventory
  - intersection
  parameters:
    source_room_class_plural: room_class_plural
    comparison_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_classes_exclusive_between_room_classes
  description: Difference between inventories, with global exclusion over the comparison group.
  question_template: Which kinds of objects occur in the {source_room_class_plural} but in none of the {comparison_room_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - class_inventory
  - difference
  parameters:
    source_room_class_plural: room_class_plural
    comparison_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_place_counts_in_content_selected_room
  description: Resolve a room by its contents and count both place layers.
  question_template: How many mapped locations are directly inside the {source_room_class_singular} containing the
    only {reference_object_class_singular} found across all {source_room_class_plural}? Count both 2D and 3D locations.
  overlap_class: related
  tags:
  - hierarchy
  - reference_resolution
  - place_union
  - count
  parameters:
    source_room_class_singular: room_class_singular
    reference_object_class_singular: object_class_singular
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - navigable_places
- id: qa_targets_nearer_external_reference
  description: Compare each target's nearest reference inside and outside its room.
  question_template: Which {target_object_class_plural} are closer to a {reference_object_class_singular} outside their room than to the nearest {reference_object_class_singular} inside it? Only consider {target_object_class_plural} whose room contains at least one {reference_object_class_singular}.
  overlap_class: related
  tags:
  - hierarchy
  - spatial
  - correlated_minima
  - room_scope
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - object_centers
- id: qa_nearest_targets_per_room
  description: Grouped minimum distances with each room's own reference set.
  question_template: For each {source_room_class_singular} containing both {target_object_class_plural} and {reference_object_class_plural}, which of its {target_object_class_plural} are closest to any of its {reference_object_class_plural}? Include all ties.
  overlap_class: related
  tags:
  - hierarchy
  - spatial
  - grouped_extrema
  parameters:
    source_room_class_singular: room_class_singular
    target_object_class_plural: object_class_plural
    reference_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_nearest_to_room_disambiguated_reference
  description: Two-stage reference resolution followed by a global search.
  question_template: Which {target_object_class_plural} anywhere in the scene are closest to the only {reference_object_class_singular} found across all {source_room_class_plural}? Include all ties.
  overlap_class: related
  tags:
  - reference_resolution
  - hierarchy
  - spatial
  - global_scope
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_global_farthest_from_selected_room
  description: Separate the anchor's room scope from the global candidate scope.
  question_template: Which {target_object_class_plural} anywhere in the scene are farthest from the center of the {source_room_class_singular} containing the only {reference_object_class_singular} found across all {source_room_class_plural}? Include all ties.
  overlap_class: related
  tags:
  - reference_resolution
  - spatial
  - farthest
  - global_scope
  parameters:
    target_object_class_plural: object_class_plural
    source_room_class_singular: room_class_singular
    reference_object_class_singular: object_class_singular
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
  - room_centers
- id: qa_targets_near_every_reference
  description: Universal spatial qualification.
  question_template: Which {target_object_class_plural} are at most {radius_m} meters from every {reference_object_class_singular}?
  overlap_class: related
  tags:
  - spatial
  - universal
  - radius
  parameters:
    target_object_class_plural: object_class_plural
    radius_m: distance_m
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_targets_near_no_reference
  description: Spatial anti-join.
  question_template: Which {target_object_class_plural} are more than {radius_m} meters from every {reference_object_class_singular}?
  overlap_class: related
  tags:
  - spatial
  - anti_join
  - radius
  parameters:
    target_object_class_plural: object_class_plural
    radius_m: distance_m
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_mean_nearest_reference_distance
  description: Aggregate a separate nearest-neighbor distance for every target.
  question_template: What is the average distance in meters from each {target_object_class_singular} to its nearest {reference_object_class_singular}?
  overlap_class: absent
  tags:
  - spatial
  - nested_aggregation
  - mean
  parameters:
    target_object_class_singular: object_class_singular
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_minimax_target
  description: Choose the target with the smallest worst-case reference distance.
  question_template: Which {target_object_class_plural} have the smallest distance to their farthest {reference_object_class_singular}? Include all ties.
  overlap_class: absent
  tags:
  - spatial
  - nested_aggregation
  - minimax
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_top_targets_per_room
  description: Rank candidates separately within each room, retaining boundary ties.
  question_template: For each {source_room_class_singular} containing both {target_object_class_plural} and {reference_object_class_plural}, which are its {top_k} {target_object_class_plural} closest to any of its {reference_object_class_plural}? Include ties at the cutoff.
  overlap_class: related
  tags:
  - hierarchy
  - spatial
  - grouped_ranking
  parameters:
    source_room_class_singular: room_class_singular
    target_object_class_plural: object_class_plural
    reference_object_class_plural: object_class_plural
    top_k: positive_integer
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_closest_pair_in_different_rooms
  description: Metric optimization constrained by negative room co-membership.
  question_template: Which pairs consisting of one {target_object_class_singular} and one {reference_object_class_singular} are closest together, if both belong to rooms but share no room? Include all ties.
  overlap_class: related
  tags:
  - spatial
  - pairs
  - hierarchy
  - anti_join
  parameters:
    target_object_class_singular: object_class_singular
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - object_centers
- id: qa_targets_within_place_hops
  description: Compose class references, direct parents, and same-layer reachability.
  question_template: Which {target_object_class_plural} are at locations in the {place_layer_name} network within {hop_limit} connections of the location of the only {reference_object_class_singular} found across all {source_room_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - connectivity
  - reference_resolution
  parameters:
    target_object_class_plural: object_class_plural
    place_layer_name: place_layer_name
    hop_limit: positive_integer
    reference_object_class_singular: object_class_singular
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - selected_place_layer
  - selected_place_connectivity
- id: qa_target_count_within_place_hops
  description: Count targets over deduplicated reachable places.
  question_template: How many {target_object_class_plural} are at locations in the {place_layer_name} network within {hop_limit} connections of the location of the only {reference_object_class_singular} found across all {source_room_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - connectivity
  - count
  parameters:
    target_object_class_plural: object_class_plural
    place_layer_name: place_layer_name
    hop_limit: positive_integer
    reference_object_class_singular: object_class_singular
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - selected_place_layer
  - selected_place_connectivity
- id: qa_room_hops_between_content_anchors
  description: Resolve both endpoints from contents and compute graph distance.
  question_template: How many room connections are needed on a shortest route from the room containing the only {reference_object_class_singular} to the room containing the only {destination_object_class_singular}?
  overlap_class: absent
  tags:
  - reference_resolution
  - connectivity
  - shortest_path
  parameters:
    reference_object_class_singular: object_class_singular
    destination_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - room_connectivity
- id: qa_shortest_room_route_avoiding_class
  description: Shortest route under a semantic exclusion.
  question_template: What is one shortest room-by-room route from the room containing the only {reference_object_class_singular} to the room containing the only {destination_object_class_singular}, without entering any {excluded_room_class_singular}? Include both endpoints.
  overlap_class: absent
  tags:
  - connectivity
  - constrained_path
  - negation
  parameters:
    reference_object_class_singular: object_class_singular
    destination_object_class_singular: object_class_singular
    excluded_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
  - room_connectivity
- id: qa_reachable_target_rooms_avoiding_class
  description: Reachability after removing an entire room category.
  question_template: From the room containing the only {reference_object_class_singular}, which other rooms containing at least one {target_object_class_singular} can be reached without entering any {excluded_room_class_singular}?
  overlap_class: related
  tags:
  - connectivity
  - hierarchy
  - constrained_reachability
  parameters:
    reference_object_class_singular: object_class_singular
    target_object_class_singular: object_class_singular
    excluded_room_class_singular: room_class_singular
  requires:
  - object_classes
  - room_classes
  - containment
  - room_connectivity
- id: qa_critical_rooms_between_anchors
  description: Identify rooms required by every route between two semantic anchors.
  question_template: Which intermediate rooms must every route pass through between the room containing the only {reference_object_class_singular} and the room containing the only {destination_object_class_singular}?
  overlap_class: absent
  tags:
  - connectivity
  - vertex_cut
  - universal_paths
  parameters:
    reference_object_class_singular: object_class_singular
    destination_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - room_connectivity
- id: qa_rooms_with_most_distinct_classes
  description: Find rooms with the greatest object-class diversity.
  question_template: Which {source_room_class_plural} contain the most different kinds of objects? Include all ties.
  overlap_class: related
  tags:
  - hierarchy
  - distinct_count
  - extrema
  parameters:
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_rooms_with_more_targets_than_references
  description: Compare two class counts separately within each room.
  question_template: Which {source_room_class_plural} contain more {target_object_class_plural} than {reference_object_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - grouped_count
  - comparison
  parameters:
    source_room_class_plural: room_class_plural
    target_object_class_plural: object_class_plural
    reference_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_class_histogram_in_room_class
  description: Count each represented object class within selected rooms.
  question_template: How many of each kind of thing are there across all the {source_room_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - histogram
  - grouped_count
  parameters:
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_rarest_classes_in_room_class
  description: Find least frequent represented classes within selected rooms.
  question_template: Which kinds of objects are least common across all the {source_room_class_plural}? Include all ties and ignore kinds that do not occur there.
  overlap_class: related
  tags:
  - hierarchy
  - grouped_count
  - minima
  parameters:
    source_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
- id: qa_targets_in_distance_band
  description: Apply lower and upper metric bounds around a resolved reference.
  question_template: Which {target_object_class_plural} are more than {inner_radius_m} but at most {outer_radius_m} meters from the only {reference_object_class_singular}?
  overlap_class: related
  tags:
  - spatial
  - distance_band
  - reference_resolution
  parameters:
    target_object_class_plural: object_class_plural
    inner_radius_m: distance_m
    outer_radius_m: distance_m
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_targets_closer_to_first_reference
  description: Compare two distances to independently resolved class references.
  question_template: Which {target_object_class_plural} are closer to the only {reference_object_class_singular} than to the only {comparison_object_class_singular}?
  overlap_class: related
  tags:
  - spatial
  - distance_comparison
  - reference_resolution
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
    comparison_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_targets_near_two_reference_classes
  description: Require separate spatial witnesses from two classes.
  question_template: Which {target_object_class_plural} are within {radius_m} meters of at least one {reference_object_class_singular} and at least one {comparison_object_class_singular}?
  overlap_class: related
  tags:
  - spatial
  - intersection
  - existential
  parameters:
    target_object_class_plural: object_class_plural
    radius_m: distance_m
    reference_object_class_singular: object_class_singular
    comparison_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_nearest_targets_outside_reference_room
  description: Separate containment exclusion from nearest-neighbor selection.
  question_template: Which {target_object_class_plural} are closest to the only {reference_object_class_singular}, excluding anything that shares a room with it? Include all ties.
  overlap_class: related
  tags:
  - spatial
  - hierarchy
  - anti_join
  - extrema
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - object_centers
- id: qa_mutual_nearest_class_pairs
  description: Find reciprocal nearest neighbors between two semantic classes.
  question_template: Which pairs of one {target_object_class_singular} and one {reference_object_class_singular} are each other's nearest match from the other kind? Include tied nearest matches.
  overlap_class: absent
  tags:
  - spatial
  - pairs
  - mutual_nearest
  parameters:
    target_object_class_singular: object_class_singular
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - object_centers
- id: qa_closest_class_pairs_per_room
  description: Compute nearest cross-class pairs independently in each room.
  question_template: For each {source_room_class_singular} containing both {target_object_class_plural} and {reference_object_class_plural}, which pairs consisting of one of each are closest together? Include all ties.
  overlap_class: related
  tags:
  - spatial
  - hierarchy
  - grouped_extrema
  - pairs
  parameters:
    source_room_class_singular: room_class_singular
    target_object_class_plural: object_class_plural
    reference_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_nearby_target_counts_per_reference
  description: Count a separate neighborhood around each reference.
  question_template: For each {reference_object_class_singular} in any {source_room_class_singular}, how many {target_object_class_plural} anywhere in the scene are within {radius_m} meters of it?
  overlap_class: related
  tags:
  - spatial
  - hierarchy
  - grouped_count
  parameters:
    reference_object_class_singular: object_class_singular
    source_room_class_singular: room_class_singular
    target_object_class_plural: object_class_plural
    radius_m: distance_m
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_rooms_adjacent_to_two_room_classes
  description: Conjoin two semantic neighbor-existence conditions.
  question_template: Which rooms are directly connected to at least one {source_room_class_singular} and at least one {comparison_room_class_singular}?
  overlap_class: related
  tags:
  - connectivity
  - intersection
  - existential
  parameters:
    source_room_class_singular: room_class_singular
    comparison_room_class_singular: room_class_singular
  requires:
  - room_classes
  - room_connectivity
- id: qa_rooms_with_only_allowed_neighbors
  description: Apply a universal class condition to a nonempty neighbor set.
  question_template: Which rooms have at least one direct neighbor and are connected only to {source_room_class_plural}?
  overlap_class: related
  tags:
  - connectivity
  - universal
  - class
  parameters:
    source_room_class_plural: room_class_plural
  requires:
  - room_classes
  - room_connectivity
- id: qa_target_rooms_within_room_hops
  description: Filter room-hop neighborhoods by their object contents.
  question_template: Which other rooms containing at least one {target_object_class_singular} are within {hop_limit} room connections of the room containing the only {reference_object_class_singular}?
  overlap_class: related
  tags:
  - connectivity
  - hierarchy
  - bounded_reachability
  parameters:
    target_object_class_singular: object_class_singular
    hop_limit: positive_integer
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - room_connectivity
- id: qa_common_place_hop_neighborhood
  description: Intersect navigation neighborhoods of two resolved anchors.
  question_template: Which locations in the {place_layer_name} network are within {hop_limit} connections of both the location of the only {reference_object_class_singular} and the location of the only {comparison_object_class_singular}?
  overlap_class: related
  tags:
  - connectivity
  - intersection
  - reference_resolution
  parameters:
    place_layer_name: place_layer_name
    hop_limit: positive_integer
    reference_object_class_singular: object_class_singular
    comparison_object_class_singular: object_class_singular
