  - object_classes
  - containment
  - selected_place_layer
  - selected_place_connectivity
- id: qa_minimum_length_place_route
  description: Optimize physical route length rather than edge count.
  question_template: What is the length in meters of a shortest route through the {place_layer_name} network between the locations of the only {reference_object_class_singular} and the only {destination_object_class_singular}? Measure each connection by the distance between its endpoints.
  overlap_class: absent
  tags:
  - connectivity
  - weighted_shortest_path
  - distance
  parameters:
    place_layer_name: place_layer_name
    reference_object_class_singular: object_class_singular
    destination_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - selected_place_layer
  - selected_place_connectivity
  - place_centers
- id: qa_room_avoidance_detour
  description: Measure the extra hops caused by a semantic route restriction.
  question_template: How many extra room connections does a shortest route need between the rooms containing the only {reference_object_class_singular} and the only {destination_object_class_singular} when all {excluded_room_class_plural} must be avoided?
  overlap_class: absent
  tags:
  - connectivity
  - constrained_path
  - distance_difference
  parameters:
    reference_object_class_singular: object_class_singular
    destination_object_class_singular: object_class_singular
    excluded_room_class_plural: room_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - room_connectivity
- id: qa_room_components_after_category_removal
  description: Count disconnected components after removing a semantic category.
  question_template: If all {excluded_room_class_plural} are removed from the room-connectivity map, how many disconnected groups of rooms remain? Count isolated rooms as separate groups.
  overlap_class: absent
  tags:
  - connectivity
  - components
  - removal
  parameters:
    excluded_room_class_plural: room_class_plural
  requires:
  - room_classes
  - room_connectivity
- id: qa_rooms_with_all_targets_near_references
  description: Universal target coverage with a separate spatial witness for each target.
  question_template: Which {source_room_class_plural} contain at least one {target_object_class_singular} and have every one of their {target_object_class_plural} within {radius_m} meters of at least one of their {reference_object_class_plural}?
  overlap_class: related
  tags:
  - hierarchy
  - spatial
  - quantifier_scope
  - universal
  parameters:
    source_room_class_plural: room_class_plural
    target_object_class_singular: object_class_singular
    target_object_class_plural: object_class_plural
    radius_m: distance_m
    reference_object_class_plural: object_class_plural
  requires:
  - object_classes
  - room_classes
  - containment
  - object_centers
- id: qa_highest_target_in_selected_room
  description: Resolve a room from a reference and maximize target height.
  question_template: Which {target_object_class_plural} have the highest centers in the room containing the only {reference_object_class_singular}? Include all ties.
  overlap_class: absent
  tags:
  - hierarchy
  - spatial
  - height
  - extrema
  parameters:
    target_object_class_plural: object_class_plural
    reference_object_class_singular: object_class_singular
  requires:
  - object_classes
  - containment
  - object_centers
  - vertical_axis
