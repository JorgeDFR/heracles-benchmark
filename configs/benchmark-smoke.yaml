---
schema_version: 1

benchmark:
  name: example-dsg-smoke-test
  scene_id: example_dsg
  scene_graph: data/scene_graphs/example_dsg.json
  expected_question_count: 3
  questions:
    qa: data/questions/example_dsg/qa_questions.smoke.yaml
    pddl: data/questions/example_dsg/pddl_questions.smoke.yaml
    metadata: data/questions/example_dsg/metadata.smoke.yaml
  output_dir: output/example_dsg/smoke

agent:
  temperature: 0.2
  seed: 123
  reasoning:
    mode: enabled
    effort: provider_default
  max_iterations: 5

providers:
  ollama:
    enabled: true
    models:
      - alias: gemma-4-12b
        model: gemma4:12b
        enabled: true
        capabilities:
          reasoning: optional
          reasoning_efforts: null
          temperature: true
          seed: true
    local_metrics:
      enabled: true
      target_provider: ollama
      ollama_container_name: ollama
      docker_host: tcp://docker-socket-proxy:2375
      ollama_host: http://ollama:11434
      sample_interval_seconds: 0.1
      gpu_baseline_seconds: 5
      unload_models_before_baseline: true
      baseline_adjust_gpu: true
      # Baseline is collected first; warmup then loads the model before measured work.
      warmup_enabled: true
      warmup_requests: 1
      warmup_prompt: Reply with OK.
      warmup_keep_alive: -1
      warmup_verify_resident: true

  openrouter:
    enabled: true
    require_parameters: true
    models:
      - alias: gpt-oss-120b
        model: openai/gpt-oss-120b
        enabled: true
        capabilities:
          reasoning: required
          reasoning_efforts: [low, medium, high]
          temperature: true
          seed: true
